<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Logesh AI Product Engineer portfolio illustration</title>
<desc id="desc">Stylized overview based on the portfolio's public React source: light glass design, Product engineering orchestrated hero, product build runtime, and project cards. Not a live website screenshot.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset=".55" stop-color="#f0f8ff"/><stop offset="1" stop-color="#f8f5ff"/></linearGradient>
