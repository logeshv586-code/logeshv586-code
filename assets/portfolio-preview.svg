 <radialGradient id="glow"><stop stop-color="#7ab9ef" stop-opacity=".34"/><stop offset="1" stop-color="#7ab9ef" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#526880" flood-opacity=".16"/></filter>
 <filter id="shadowsmall" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#6583a0" flood-opacity=".13"/></filter>
